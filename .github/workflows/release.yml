name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify tag and committed build
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
          git diff --exit-code -- lib

      - name: Pack and checksum
        shell: bash
        run: |
          mkdir dist
          pnpm pack --pack-destination dist
          tarball=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          sha256sum "$tarball" > "$tarball.sha256"

      - name: Publish to npm with provenance
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          publish_tag=latest
          case "$version" in
            *-*) publish_tag=next ;;
          esac
          if ! npm view "@huanghai-lab/dsh-custom-instructions@$version" version >/dev/null 2>&1; then
            npm publish ./dist/*.tgz --access public --provenance --tag "$publish_tag"
          fi
          for attempt in 1 2 3 4 5 6; do
            published=$(npm view "@huanghai-lab/dsh-custom-instructions@$version" version 2>/dev/null || true)
            tagged=$(npm view "@huanghai-lab/dsh-custom-instructions" "dist-tags.$publish_tag" 2>/dev/null || true)
            [ "$published" = "$version" ] && [ "$tagged" = "$version" ] && exit 0
            sleep 10
          done
          exit 1

      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

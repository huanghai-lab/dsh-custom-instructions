# dsh-custom-instructions bundle patch: inserts the dual-face plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:~/dsh-custom-instructions`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (the /api/dsh-custom-instructions route family that
# reads/writes ~/.dsh/AGENTS.md), and the `dsh.client` declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: custom-instructions
      name: '@huanghai-lab/dsh-custom-instructions'
